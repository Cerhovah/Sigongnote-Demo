[project]
name = "sigongnote-document-worker"
version = "0.1.0"
requires-python = "==3.13.*"
dependencies = [
    "defusedxml==0.7.1",
    "jsonschema==4.26.0",
    # Keep the existing validators for the generated date-time and URI formats.
    "rfc3339-validator==0.1.4",
    "rfc3987==1.3.8",
    "olefile==0.47",
    "openpyxl==3.1.5",
    "reportlab>=5.0.1",
    "pdfplumber==0.11.10",
    "pypdf==6.19.0",
    "pillow>=12.3.0",
    "xlrd==2.0.2",
    "av==19.0.0",
]
[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/sigongnote_worker"]

[tool.pytest.ini_options]
markers = ["hwp: HWP5 and HWPX structure parser tests", "pdf: PDF parser tests", "spreadsheet: XLS and XLSX parser tests", "media: image and audio adapter tests"]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "xlwt==1.3.0",
]
